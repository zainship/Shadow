[package]
name = "jarvis-desktop"
version = "0.1.0"
description = "Voice-only Shadow desktop assistant for full laptop automation, research, and YouTube playback"
authors = ["Shadow Desktop"]
edition = "2021"

[lib]
name = "jarvis_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
